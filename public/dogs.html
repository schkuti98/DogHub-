<!doctype html>
<html lang="de">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Meine Hunde | DogTrainer Hub</title>
      <link
         href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
         rel="stylesheet"
         integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
         crossorigin="anonymous"
      />
      <link rel="stylesheet" href="css/style.css" />
   </head>
   <body>
      <header>
         <nav aria-label="Hauptnavigation">
            <a class="nav-brand" href="index.html">DogTrainer Hub</a>
            <ul>
               <li><a href="index.html">Home</a></li>
               <li><a href="dogs.html" aria-current="page">Hunde</a></li>
               <li><a href="tricks.html">Tricks</a></li>
            </ul>
            <button id="logout-btn" class="login-text-button" type="button">Abmelden</button>
         </nav>
      </header>

      <main class="dogs-page">
         <section class="welcome">
            <h1>Meine Hunde</h1>
            <p>Hier siehst du deine Hunde und ihren Fortschritt.</p>

            <form id="dog-form" class="profile-columns" aria-label="Hund hinzufügen">
               <div>
                  <label for="dog-name" class="form-label">Name</label>
                  <input id="dog-name" name="name" type="text" class="form-control" placeholder="z. B. Bella" required />

                  <label for="dog-breed" class="form-label mt-2">Rasse</label>
                  <input id="dog-breed" name="breed" type="text" class="form-control" placeholder="z. B. Labrador" required />

                  <label for="dog-age" class="form-label mt-2">Alter</label>
                  <input id="dog-age" name="age" type="number" class="form-control" min="0" step="1" placeholder="z. B. 3" />

                  <button class="btn btn-warning mt-3" type="submit">Hund hinzufügen</button>
               </div>
            </form>
         </section>

         <section class="dog-profile" aria-labelledby="dog-list-title">
            <div class="profile-header">
               <div>
                  <h2 id="dog-list-title">Hundeliste</h2>
                  <p>Alle Hunde aus der Datenbank. Du kannst sie hier löschen.</p>
               </div>
            </div>

            <p id="dog-message" class="login-message" role="status"></p>
            <div id="dog-list" class="dog-list" aria-live="polite"></div>
         </section>
      </main>

      <footer>
         <p>&copy; 2026 DogTrainer Hub. Alle Rechte vorbehalten.</p>
      </footer>
      <script src="js/auth.js"></script>
      <script>requireAuth();</script>
      <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
         crossorigin="anonymous"
      ></script>
      <script src="js/dogs.js"></script>
   </body>
</html>
